name: Build and Release Desktop Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag"
        required: false
        default: ""
      release_name:
        description: "Release Name"
        required: false
        default: ""
      prerelease:
        description: "Mark as prerelease"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  build-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            goos: windows
            goarch: amd64
            artifact_name: release-windows-amd64
            package_name: TRPG模组笔记-windows-amd64.zip
          - os: windows-latest
            platform: windows
            goos: windows
            goarch: arm64
            artifact_name: release-windows-arm64
            package_name: TRPG模组笔记-windows-arm64.zip
          - os: ubuntu-latest
            platform: linux
            goos: linux
            goarch: amd64
            artifact_name: release-linux-amd64
            package_name: TRPG模组笔记-linux-amd64.tar.gz
          - os: ubuntu-latest
            platform: linux
            goos: linux
            goarch: arm64
            artifact_name: release-linux-arm64
            package_name: TRPG模组笔记-linux-arm64.tar.gz
          - os: macos-14
            platform: macos
            goos: darwin
            goarch: arm64
            artifact_name: release-macos-arm64
            package_name: TRPG模组笔记-macos-arm64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          raw="$(tr -d '\r\n' < version.txt)"
          raw="${raw#v}"
          echo "app_version=${raw}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${raw}" >> "${GITHUB_OUTPUT}"
          echo "package_name=TRPG模组笔记-${raw}-${{ matrix.platform }}-${{ matrix.goarch }}${{ matrix.platform == 'windows' && '.zip' || matrix.platform == 'macos' && '.zip' || '.tar.gz' }}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "effective_tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            echo "effective_tag=${{ inputs.release_tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "effective_tag=v${raw}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows EXE
        if: ${{ matrix.platform == 'windows' }}
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-X main.buildAppVersion=${{ steps.version.outputs.effective_tag }}" -o release/TRPG模组笔记.exe
          go build -o release/数据库检查工具.exe ./cmd/database-doctor

      - name: Create Windows ZIP
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $staging = "server/release/package"
          if (Test-Path $staging) {
            Remove-Item -Path $staging -Recurse -Force
          }
          New-Item -Path $staging -ItemType Directory | Out-Null

          Copy-Item -Path "server/release/TRPG模组笔记.exe" -Destination "$staging/TRPG模组笔记.exe" -Force
          Copy-Item -Path "server/release/数据库检查工具.exe" -Destination "$staging/数据库检查工具.exe" -Force

          if (Test-Path "server/release/data") {
            Copy-Item -Path "server/release/data" -Destination "$staging/data" -Recurse -Force
          } else {
            New-Item -Path "$staging/data" -ItemType Directory | Out-Null
          }

          Compress-Archive `
            -Path "$staging/*" `
            -DestinationPath "${{ steps.version.outputs.package_name }}" `
            -Force

      - name: Build Linux binary
        if: ${{ matrix.platform == 'linux' }}
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-X main.buildAppVersion=${{ steps.version.outputs.effective_tag }}" -o release/trpg-note

      - name: Build macOS app binary
        if: ${{ matrix.platform == 'macos' }}
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -ldflags "-X main.buildAppVersion=${{ steps.version.outputs.effective_tag }}" -o release/trpg-note

      - name: Create Linux tar.gz
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          staging="server/release/package"
          rm -rf "$staging"
          mkdir -p "$staging"

          cp "server/release/trpg-note" "$staging/trpg-note"
          chmod +x "$staging/trpg-note"

          if [ -d "server/release/data" ]; then
            cp -R "server/release/data" "$staging/data"
          else
            mkdir -p "$staging/data"
          fi

          tar -C "$staging" -czf "${{ steps.version.outputs.package_name }}" .

      - name: Create macOS app package
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.effective_tag }}
        run: |
          bash ./scripts/package-macos-app.sh "server/release/trpg-note" "${{ steps.version.outputs.package_name }}"

      - name: Verify macOS app bundle structure
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          APP_PATH="server/release/TRPG模组笔记.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          test -x "$APP_PATH/Contents/MacOS/trpg-note"
          test -x "$APP_PATH/Contents/MacOS/trpg-note-launcher"
          plutil -lint "$APP_PATH/Contents/Info.plist"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.version.outputs.package_name }}
          if-no-files-found: error

  publish-release:
    needs: build-packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release meta
        id: version
        shell: bash
        run: |
          raw="$(tr -d '\r\n' < version.txt)"
          raw="${raw#v}"
          file_tag="v${raw}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${file_tag}"
          fi
          if [[ -n "${{ inputs.release_name }}" ]]; then
            name="${{ inputs.release_name }}"
          else
            name="${tag}"
          fi
          echo "app_version=${raw}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Validate release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [[ ! "${{ steps.version.outputs.tag }}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "release_tag 必须是 vX.Y 或 vX.Y.Z 格式，例如 v1.2 或 v1.2.0" >&2
            exit 1
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && false || (inputs.prerelease == 'true') }}
          draft: false
          make_latest: true
          body: |
            ## ${{ steps.version.outputs.name }} 更新内容
            - fix：修复 Markdown 加粗在编辑与预览模式下显示不一致的问题。
            - fix：优化模组保存机制，保留保存凭证、进入模组时读取最新版本，仅提交实际修改并等待进行中的保存请求；版本检查与写入使用同一事务。发生冲突时保留当前修改，加载远端前支持导出 JSON 副本并确认是否放弃修改。
            - fix：连接与保存状态集中到右上角，展示本机延迟、近期活跃成员及角色，支持刷新；区分加载、待保存、保存中、失败和最近保存时间，延后正常自动保存期间的提醒，失败时提供重试入口。
            - fix：统一图片读取、移动后的旧引用解析和导出打包逻辑，保护仍被资料、团队笔记、共享内容或回收站引用的图片，并显示批量操作失败项。
            - feat：搜索覆盖区块标题、子项目正文、标签、别名和时间线节点，按 Markdown 实际显示文字匹配；新增资料搜索浮窗，按权限检索普通及共享资料，支持即时筛选、类型过滤、摘要、固定和右侧打开，无需预先配置关键词。
            - fix：标签筛选按账号、模组与资料类型保存在本机，进入详情后返回或刷新仍保留选择，无匹配资料时也可调整筛选。
            - feat：回收站替换版本记录界面，支持恢复七类普通资料，默认保留 3 天，可按模组调整为 1–3650 天，支持到期清理和彻底删除；删除前保存最新内容，恢复保留原 ID 并防止覆盖，完整备份包含回收站与保留设置。兼容非 JSON 错误响应，旧后端缺少接口时提示更新 EXE 或检查代理。
            - feat：备团包导出提示未选及失效的关联依赖，可补选全部可用关联，缺少依赖时需确认；同时修正依赖索引的类型声明，解决打包错误。
            - feat：支持复制普通资料，以及保存、复用和删除模组内的区块结构模板；复制生成新 ID，模板不携带正文、关系和图片。
            - feat：统一跑团工作台集中展示线索、任务、笔记和场次，兼顾单人与团队使用，保留原栏目链接及权限控制，任务和笔记切换页签前先保存；场次使用紧凑列表，详情分为准备、现场和复盘页签。
            - ui：统一常驻侧栏、顶部工具栏和独立滚动内容区，导航按跑团、资料、整理工具和管理分组，并按身份显示入口；各页面减少卡片嵌套，保留主题配色、适度圆角和适量玻璃效果，适配窄屏与画布空间。
            - ui：资料详情外层面板贴合正文宽度并加强外边界，内部用细边框、浅色标题栏和正文缩进区分层级；主要区块默认展开，标签及低频管理操作可折叠。
            - ui：模组选择主页采用紧凑卡片，新建移至工具栏，成员、权限、备份和删除收进单卡管理区，展开不撑高同排卡片；主题与全局工具收进菜单。
            - ui：模组概览恢复为默认入口，置于跑团工作台前，展示统计入口、资料搜索、最近编辑和备忘录，玩家仍按原权限查看。
            - ui：设置页采用分类页签与平面表单，主题与样式合并到基本设置，备份导入、资源、回收站和版本更新按类展示。
          files: |
            TRPG模组笔记-${{ steps.version.outputs.app_version }}-windows-amd64.zip
            TRPG模组笔记-${{ steps.version.outputs.app_version }}-windows-arm64.zip
            TRPG模组笔记-${{ steps.version.outputs.app_version }}-linux-amd64.tar.gz
            TRPG模组笔记-${{ steps.version.outputs.app_version }}-linux-arm64.tar.gz
            TRPG模组笔记-${{ steps.version.outputs.app_version }}-macos-arm64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
